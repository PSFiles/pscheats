<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS Cheats · PS3, PS4, PS5 and PS Vita cheat codes</title>
<meta name="description" content="Instant search across the whole cheat collection for PS3 (Artemis), PS4 (GoldHEN), PS5 (HEN) and PS Vita (VitaCheat) — by game, serial, region or cheat name.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8cff'/%3E%3Ctext x='32' y='43' font-family='system-ui,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23071018'%3EPS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="brand">
      <span class="logo" aria-hidden="true">PS</span>
      <div class="brand-text">
        <h1>PS&nbsp;Cheats</h1>
        <p class="tagline">Cheat codes for PS3, PS4, PS5 and PS Vita — search by game, serial, region or cheat name.</p>
      </div>
    </div>

    <form class="search" id="search-form" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input id="q" type="search" name="q" placeholder="Search game, serial (BLES01017), region or cheat…" aria-label="Search game, serial, region or cheat" spellcheck="false">
      <button type="button" id="clear" class="clear" hidden aria-label="Clear search">×</button>
      <kbd class="hint" aria-hidden="true">/</kbd>
    </form>

    <div class="controls">
      <div class="filter-rows">
        <div class="filters" id="platforms" role="group" aria-label="Filter by platform">
          <button type="button" class="chip" data-p="" aria-pressed="true" title="All platforms">
            <span>All</span><span class="chip-n" data-count="all">—</span>
          </button>
          <button type="button" class="chip" data-p="PS3" aria-pressed="false" title="Filter by PS3">
            <span class="dot dot-ps3" aria-hidden="true"></span><span>PS3</span><span class="chip-n" data-count="PS3">—</span>
          </button>
          <button type="button" class="chip" data-p="PS4" aria-pressed="false" title="Filter by PS4">
            <span class="dot dot-ps4" aria-hidden="true"></span><span>PS4</span><span class="chip-n" data-count="PS4">—</span>
          </button>
          <button type="button" class="chip" data-p="PS5" aria-pressed="false" title="Filter by PS5">
            <span class="dot dot-ps5" aria-hidden="true"></span><span>PS5</span><span class="chip-n" data-count="PS5">—</span>
          </button>
          <button type="button" class="chip" data-p="PSV" aria-pressed="false" title="Filter by PS Vita">
            <span class="dot dot-psv" aria-hidden="true"></span><span>Vita</span><span class="chip-n" data-count="PSV">—</span>
          </button>
        </div>

        <div class="filters" id="regions" role="group" aria-label="Filter by region">
          <button type="button" class="chip" data-r="" aria-pressed="true" title="Any region">
            <span>All regions</span>
          </button>
          <button type="button" class="chip" data-r="EUR" aria-pressed="false" title="Filter by Europe">
            <span>EUR</span><span class="chip-n" data-rcount="EUR">—</span>
          </button>
          <button type="button" class="chip" data-r="USA" aria-pressed="false" title="Filter by the Americas">
            <span>USA</span><span class="chip-n" data-rcount="USA">—</span>
          </button>
          <button type="button" class="chip" data-r="JPN" aria-pressed="false" title="Filter by Japan">
            <span>JPN</span><span class="chip-n" data-rcount="JPN">—</span>
          </button>
          <button type="button" class="chip" data-r="ASIA" aria-pressed="false" title="Filter by Asia">
            <span>ASIA</span><span class="chip-n" data-rcount="ASIA">—</span>
          </button>
          <button type="button" class="chip" data-r="KOR" aria-pressed="false" title="Filter by Korea">
            <span>KOR</span><span class="chip-n" data-rcount="KOR">—</span>
          </button>
        </div>
      </div>
      <label class="sort">
        <span>Sort</span>
        <select id="sort">
          <option value="title">Title (A–Z)</option>
          <option value="cheats">Most cheats</option>
          <option value="serial">Serial</option>
        </select>
      </label>
      <span id="stats" class="stats" aria-live="polite">loading…</span>
    </div>
  </div>
</header>

<main class="wrap main">
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <ul id="list" class="list"></ul>
  <div id="more" class="more"></div>
</main>

<footer class="wrap foot">
  <p>
    Data from <a href="https://github.com/mohasi/game-cheats" rel="noopener">mohasi/game-cheats</a>,
    <a href="https://github.com/bucanero/ArtemisPS3/tree/master/docs/codes" rel="noopener">bucanero/ArtemisPS3</a>,
    <a href="https://github.com/GoldHEN/GoldHEN_Cheat_Repository" rel="noopener">GoldHEN</a> and
    <a href="https://github.com/TeeKay87/HEN-Cheats-Collection" rel="noopener">TeeKay87/HEN-Cheats-Collection</a>.
    All credit to the authors of each cheat.
  </p>
</footer>

<div id="backdrop" class="backdrop" hidden></div>

<aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawer-title">
  <header class="drawer-head">
    <div class="drawer-title-wrap">
      <h2 id="drawer-title">…</h2>
      <p id="drawer-meta" class="drawer-meta"></p>
    </div>
    <button type="button" id="drawer-close" class="icon-btn" aria-label="Close details">×</button>
  </header>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<script src="assets/app.js" defer></script>
</body>
</html>
